name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run publish in dry-run mode
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_store_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Use Yarn 1.x
        run: corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          LERNA_VERSION="$(node -p "require('./lerna.json').version")"

          echo "Tag version:   ${TAG_VERSION}"
          echo "Lerna version: ${LERNA_VERSION}"

          if [ "${TAG_VERSION}" != "${LERNA_VERSION}" ]; then
            echo "::error::Tag version (${TAG_VERSION}) does not match lerna.json version (${LERNA_VERSION})"
            exit 1
          fi

      - name: Build all packages
        run: yarn lerna run compile

      - name: Run tests
        run: yarn lerna run test --concurrency 1

      - name: Publish packages
        run: |
          set -euo pipefail

          DRY_RUN='${{ github.event.inputs.dry_run || 'false' }}'

          if [ "${DRY_RUN}" = "true" ]; then
            # Packaging validation only: never invoke publish in dry-run mode.
            for package_dir in packages/*; do
              if [ "$(node -p "Boolean(require('./${package_dir}/package.json').private)")" = "false" ]; then
                (cd "${package_dir}" && npm pack --dry-run)
              fi
            done
          else
            VERSION="$(node -p "require('./lerna.json').version")"
            NPM_TAG=latest
            if [[ "${VERSION}" == *-* ]]; then NPM_TAG=next; fi
            # Authenticate with the package-specific GitHub Actions OIDC trust.
            # Publish types first so downstream prerelease dependencies are available.
            for package_dir in packages/event-store-types packages/event-store-core packages/event-store-aggregate packages/event-store-revert packages/event-store-adapter-pg packages/event-store-adapter-expo-sqlite; do
              NAME="$(node -p "require('./${package_dir}/package.json').name")"
              if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
                echo "Already published: ${NAME}@${VERSION}"
              else
                (cd "${package_dir}" && npx --yes npm@11 publish --access public --tag "${NPM_TAG}")
              fi
            done
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RELEASE_ARGS=()
          if [[ "${TAG}" == *-* ]]; then RELEASE_ARGS+=(--prerelease); fi
          gh release create "${TAG}" "${RELEASE_ARGS[@]}" \
            --title "${TAG}" \
            --generate-notes \
            --verify-tag
